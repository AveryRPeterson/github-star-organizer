name: Maintenance
on:
  schedule:
    - cron: '0 14 * * *'  # Daily at 6am PST (2pm UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: log intended changes, mutate nothing'
        type: boolean
        default: true

jobs:
  categorize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state DB
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: state.db
          key: github-star-state-v1-${{ github.run_id }}
          restore-keys: github-star-state-v1-

      - name: Recover DB from backup branch (cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          git fetch origin state-backup 2>/dev/null && \
          git checkout origin/state-backup -- state.db 2>/dev/null || true

      - name: Verify GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if ! gh api user --silent 2>/dev/null; then
            msg="GH_TOKEN is missing, expired, or invalid. Rotate the GH_TOKEN repository secret."
            echo "::error title=GH_TOKEN invalid::$msg"
            echo "### :x: $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Organize Stars
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_NEW_LIST_PER_WEEK: ${{ vars.MAX_NEW_LIST_PER_WEEK || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 categorize.py

      - name: Save state DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: github-star-state-v1-${{ github.run_id }}

      - name: Backup DB to state-backup branch
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin state-backup 2>/dev/null || true
          if git ls-remote --exit-code origin state-backup 2>/dev/null; then
            git checkout state-backup
          else
            git checkout --orphan state-backup
            git rm -rf . 2>/dev/null || true
          fi
          cp ${{ github.workspace }}/state.db state.db 2>/dev/null || true
          git add state.db
          git diff --cached --quiet || git commit -m "Daily state backup $(date -u +%Y-%m-%d)"
          git push origin state-backup
